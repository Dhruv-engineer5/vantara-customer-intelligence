# One command: docker compose up --build
# Starts PostgreSQL, the FastAPI service (seeds the database on first start) and the Streamlit dashboard.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python scripts/setup_env.py to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-vantara}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vantara} -d ${POSTGRES_DB:-vantara}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-vantara}:${POSTGRES_PASSWORD:?run python scripts/setup_env.py to create .env}@db:5432/${POSTGRES_DB:-vantara}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_ARTIFACTS_DIR: ${MODEL_ARTIFACTS_DIR:-models_artifacts}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  dashboard:
    build: .
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
